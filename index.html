<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Canarisk | Coming Soon</title>
    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes shootingStar {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            100% { transform: translateY(500px) translateX(-700px); opacity: 0; }
        }
        @keyframes flameFlicker {
            0%, 100% { transform: scaleY(1); opacity: 0.9; }
            50% { transform: scaleY(1.3); opacity: 1; }
        }
        /* Trajectoire aller-retour avec changement d'orientation et effet de surprise */
        @keyframes flyAcross {
            0% {
                transform: translate(-150px, 120vh) rotate(25deg) scale(0.7);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            45% {
                opacity: 1;
            }
            /* Disparition en haut à droite */
            50% {
                transform: translate(110vw, -20vh) rotate(25deg) scale(0.7);
                opacity: 0;
            }
            /* Réapparition instantanée de l'autre côté, orientée différemment pour l'effet de surprise */
            50.1% {
                transform: translate(110vw, 30vh) rotate(-135deg) scale(0.8);
                opacity: 0;
            }
            55% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(-150px, 80vh) rotate(-135deg) scale(0.8);
                opacity: 0;
            }
        }
        .star {
            animation: twinkle 3s infinite ease-in-out;
        }
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, white, rgba(255,255,255,0));
            animation: shootingStar 4s linear infinite;
        }
        .rocket-container {
            position: absolute;
            z-index: 3;
            animation: flyAcross 54s linear infinite;
        }
        .rocket-flame {
            animation: flameFlicker 0.15s ease-in-out infinite alternate;
            transform-origin: 50% 70px;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #000308; color: #fff; font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; width: 100vw;">

    <!-- Ciel étoilé & Étoiles filantes -->
    <svg style="position: absolute; width: 100%; height: 100%; z-index: 0;">
        <rect width="100%" height="100%" fill="url(#spaceGrad)"/>
        <defs>
            <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#050a15"/>
                <stop offset="100%" stop-color="#000"/>
            </radialGradient>
        </defs>
        <circle class="star" cx="15%" cy="20%" r="0.8" fill="white" style="animation-duration: 3s;" />
        <circle class="star" cx="80%" cy="10%" r="1.2" fill="white" style="animation-duration: 4s;" />
        <circle class="star" cx="45%" cy="80%" r="0.7" fill="#ccf" opacity="0.8" style="animation-duration: 2.5s;" />
        <circle class="star" cx="90%" cy="70%" r="0.5" fill="white" style="animation-duration: 2s;" />
        <circle class="star" cx="10%" cy="85%" r="0.8" fill="white" opacity="0.5" style="animation-duration: 5s;" />
        <circle class="star" cx="65%" cy="30%" r="1.2" fill="#ffc" opacity="0.8" style="animation-duration: 3.5s;" />

        <!-- Étoiles filantes -->
        <line x1="75%" y1="5%" x2="55%" y2="25%" stroke="white" stroke-width="1.5" stroke-linecap="round" class="shooting-star" style="animation-duration: 5s; animation-delay: 1s;" />
        <line x1="30%" y1="10%" x2="10%" y2="30%" stroke="white" stroke-width="1" stroke-linecap="round" class="shooting-star" style="animation-duration: 7s; animation-delay: 3s;" />
    </svg>

    <!-- Fusée Animée lente avec changement d'orientation et effet de surprise -->
    <div class="rocket-container">
        <svg width="90" height="90" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Flamme du réacteur -->
            <g class="rocket-flame">
                <path d="M42 70 L50 98 L58 70 Z" fill="#FFC300" />
                <path d="M45 70 L50 88 L55 70 Z" fill="#FF5733" />
            </g>
            <!-- Corps de la fusée -->
            <path d="M50 15 C38 35 38 60 50 80 C62 60 62 35 50 15" fill="#f0f0f0" />
            <path d="M50 15 L38 68 L50 62 L62 68 Z" fill="#FF3b30" />
            <circle cx="50" cy="40" r="6" fill="#1e90ff" stroke="#fff" stroke-width="1.5" />
            <!-- Ailerons -->
            <path d="M38 68 L25 82 L44 73 Z" fill="#FFC300" />
            <path d="M62 68 L75 82 L56 73 Z" fill="#FFC300" />
        </svg>
    </div>

    <!-- Planète Terre -->
    <svg width="700" height="700" viewBox="0 0 100 100" style="position: absolute; top: -120px; left: -120px; z-index: 1;">
        <defs>
            <filter id="atmoGlow">
                <feGaussianBlur stdDeviation="1.5" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
            <radialGradient id="earthWater" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#1e90ff"/>
                <stop offset="50%" stop-color="#0052a3"/>
                <stop offset="100%" stop-color="#001a33"/>
            </radialGradient>
            <clipPath id="globeClip">
                <circle cx="50" cy="50" r="45" />
            </clipPath>
        </defs>

        <circle cx="50" cy="50" r="47" fill="#4fb3ff" opacity="0.2" filter="url(#atmoGlow)"/>

        <circle cx="50" cy="50" r="45" fill="url(#earthWater)"/>

        <g clip-path="url(#globeClip)">
            <g fill="#1a472a" opacity="0.95">
                <g id="landMass">
                    <path d="M15 35 L18 30 L25 28 L30 32 L35 30 L32 45 L25 50 L20 45 Z" /> <path d="M25 55 L32 58 L35 65 L33 75 L28 85 L22 75 L23 60 Z" /> <path d="M55 25 L60 22 L70 20 L80 22 L85 28 L75 35 L65 38 L57 32 Z" /> <path d="M55 40 L65 38 L75 42 L77 55 L70 70 L60 75 L53 65 L52 50 Z" /> <path d="M115 35 L118 30 L125 28 L130 32 L135 30 L132 45 L125 50 L120 45 Z" />
                    <path d="M125 55 L132 58 L135 65 L133 75 L128 85 L122 75 L123 60 Z" />
                    <path d="M155 25 L160 22 L170 20 L180 22 L185 28 L175 35 L165 38 L157 32 Z" />
                    <path d="M155 40 L165 38 L175 42 L177 55 L170 70 L160 75 L153 65 L152 50 Z" />
                </g>
                <animateTransform attributeName="transform" type="translate" from="0" to="-100" dur="60s" repeatCount="indefinite" />
            </g>

            <g opacity="0.3">
                <g>
                    <path d="M20 40 Q40 20 70 35 T90 50" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M15 60 Q45 75 80 55" stroke="white" stroke-width="5" fill="none" opacity="0.5"/>
                    <path d="M120 40 Q140 20 170 35 T190 50" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M115 60 Q145 75 180 55" stroke="white" stroke-width="5" fill="none" opacity="0.5"/>
                </g>
                <animateTransform attributeName="transform" type="translate" from="0" to="-100" dur="35s" repeatCount="indefinite" />
            </g>
        </g>

        <path d="M50 5 A45 45 0 0 1 50 95 A35 45 0 0 0 50 5" fill="black" opacity="0.7" />
    </svg>

    <!-- Contenu texte -->
    <div style="position: absolute; top: 50%; right: 5%; transform: translateY(-50%); text-align: right; z-index: 2; width: 45%;">
        <div lang="en">
            <h1 style="font-size: clamp(3em, 8vw, 6em); margin: 0; line-height: 0.85; text-shadow: 0 0 30px rgba(30, 144, 255, 0.5);">COMING<br>SOON</h1>
            <p style="font-size: 1.2em; font-family: 'Segoe UI', sans-serif; color: #1e90ff; margin-top: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;">The orbit is active.</p>
        </div>
        
        <div style="height: 2px; width: 80px; background: #fff; margin: 40px 0 40px auto; border-radius: 2px;"></div>

        <div lang="fr">
            <h1 style="font-size: clamp(2em, 6vw, 4em); margin: 0; line-height: 0.85; opacity: 0.9;">BIENTÔT<br>DISPONIBLE</h1>
            <p style="font-size: 1.1em; font-family: 'Segoe UI', sans-serif; color: #1a472a; margin-top: 15px; font-weight: bold;">Rotation système en cours.</p>
        </div>
    </div>

    <!-- Pied de page -->
    <footer style="position: absolute; bottom: 30px; right: 5%; font-family: 'Courier New', Courier, monospace; font-size: 0.8em; color: #333;">
        SYSTEM STATUS: ROTATING | MISSION 2026
    </footer>

</body>
</html>
